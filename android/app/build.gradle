plugins {
    // Kotlin is compiled by AGP 9.0's built-in Kotlin support.
    id 'com.android.application'
}

// Optional release signing — read from keystore.properties if present (git-ignored).
def keystorePropsFile = rootProject.file('keystore.properties')
def hasKeystore = keystorePropsFile.exists()
def keystoreProps = new Properties()
if (hasKeystore) { keystorePropsFile.withInputStream { keystoreProps.load(it) } }

android {
    namespace 'com.bloomfieldinnovations.unirp'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.bloomfieldinnovations.unirp'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile rootProject.file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            // R8 + resource shrinking for the smallest installable APK.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystore) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'androidx.webkit:webkit:1.11.0'
}

// ---------------------------------------------------------------------------
// Single source of truth: the web app at the repo root IS the app. Rather than
// duplicating index.html / indriya.html / assets/ into the APK, we copy them
// into src/main/assets at build time so the bundled app never drifts from the
// web version (and the persistence + free-nav fixes apply automatically).
// The copied folder is git-ignored.
// ---------------------------------------------------------------------------
tasks.register('syncWebAssets', Copy) {
    description 'Bundles the web app (repo root) into the APK assets.'
    group 'build'
    def repoRoot = rootProject.projectDir.parentFile   // android/.. == repo root
    into layout.projectDirectory.dir('src/main/assets')
    from(repoRoot) { include 'index.html', 'indriya.html' }
    into('assets') { from new File(repoRoot, 'assets') }
}

tasks.named('preBuild') {
    dependsOn 'syncWebAssets'
}
