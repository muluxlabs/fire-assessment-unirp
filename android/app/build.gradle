plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.bloomfieldinnovations.unirp'
    compileSdk 34

    defaultConfig {
        applicationId 'com.bloomfieldinnovations.unirp'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'androidx.webkit:webkit:1.11.0'
}

// ---------------------------------------------------------------------------
// Single source of truth: the web app at the repo root IS the app. Rather than
// duplicating index.html / indriya.html / assets/ into the APK, we copy them
// into src/main/assets at build time so the bundled app never drifts from the
// web version (and the persistence + free-nav fixes apply automatically).
// The copied folder is git-ignored.
// ---------------------------------------------------------------------------
tasks.register('syncWebAssets', Copy) {
    description 'Bundles the web app (repo root) into the APK assets.'
    group 'build'
    def repoRoot = rootProject.projectDir.parentFile   // android/.. == repo root
    into layout.projectDirectory.dir('src/main/assets')
    from(repoRoot) { include 'index.html', 'indriya.html' }
    into('assets') { from new File(repoRoot, 'assets') }
}

tasks.named('preBuild') {
    dependsOn 'syncWebAssets'
}
